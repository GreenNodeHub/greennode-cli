name: Run Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: go vet
        working-directory: go
        run: go vet ./...

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        working-directory: go
        run: CGO_ENABLED=0 go build -o grn .

      - name: Verify binary
        working-directory: go
        run: ./grn --version

      - name: Run tests
        working-directory: go
        # Use the external (system) linker so test binaries get an LC_UUID load
        # command. Go 1.22's internal linker omits it, and recent macOS dyld
        # aborts such binaries ("missing LC_UUID load command"). CGO is enabled
        # so the system cc (present on both ubuntu and macos runners) links.
        run: CGO_ENABLED=1 go test -ldflags='-linkmode=external' ./... -v

  installer-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shellcheck (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install shellcheck
      - name: shellcheck install.sh
        run: shellcheck scripts/install.sh
      - name: Release-contract test (SHA256SUMS shape)
        run: bash tests/release.test.sh
      - name: install.sh hermetic test
        run: bash tests/install.test.sh

  installer-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (for http.server test fixtures)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install.ps1 smoke test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\install.test.ps1
      - name: install.cmd smoke test
        shell: cmd
        run: tests\install.test.cmd
